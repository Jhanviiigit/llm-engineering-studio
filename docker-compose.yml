# Local infrastructure for development.
#
#   docker compose up -d                          database only (run the API
#                                                 and UI from .venv as usual)
#   docker compose --profile app up -d --build    whole stack in containers:
#                                                 UI http://localhost:8501
#                                                 API http://localhost:8000/docs
#   docker compose --profile app down             stop everything (data is kept
#                                                 in the "pgdata" volume)
#
# In the cloud: db -> Cloud SQL, api and ui -> Cloud Run services.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    # OPENROUTER_API_KEY and other settings come from .env ...
    env_file:
      - path: .env
        required: false
    # ... but inside the Docker network the database is reached by its
    # service name "db", not "localhost" (which is the container itself).
    environment:
      DATABASE_URL: postgresql://studio:studio@db:5432/studio
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ui:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://api:8080
    ports:
      - "8501:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
