# Continuous integration: runs on every push to master and on every
# pull request. Results show in the "Checks" tab of each PR.

name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel an older run of the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real Postgres + pgvector, so the database integration tests run
    # too. GitHub starts it next to the job and waits for the healthcheck.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # CPU-only PyTorch: the default Linux build includes several GB
          # of CUDA libraries that are useless without a GPU
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0+cpu
          pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://studio:studio@localhost:5432/studio_test
        run: python -m pytest -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only checks that the images build; publishing to a registry comes
      # with the GCP deployment in Phase 3.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: false
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
